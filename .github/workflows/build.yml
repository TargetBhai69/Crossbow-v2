name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
      - name: Merge
        run: |
          mkdir -p merged
          python3 tools/merge.py fpsdisplay.jar "$(ls build/libs/fpsdisplay-hook-*.jar | grep -v sources | head -1)" "merged/fpsdisplay-4.1.2.1+1.21.1.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: fpsdisplay
          path: merged/*.jar
